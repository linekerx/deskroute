name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/release-notes/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Выпустить релиз (если выключено — только собрать)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: ubuntu-latest
            target: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage

  android:
    runs-on: ubuntu-latest
    env:
      LIBV2RAY_VERSION: v26.10.31
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ядро libv2ray (Xray для Android)
        run: |
          mkdir -p android/app/libs /tmp/geo
          curl -fsSL -o android/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_VERSION}/libv2ray.aar"
          unzip -o -q android/app/libs/libv2ray.aar 'assets/geosite.dat' 'assets/geoip.dat' -d /tmp/geo
      - name: Интерфейс
        run: node scripts/build-android-web.js /tmp/geo/assets/geosite.dat /tmp/geo/assets/geoip.dat
      - name: Сборка APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Имена файлов
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p dist
          D=android/app/build/outputs/apk/release
          cp "$D/app-arm64-v8a-release.apk" "dist/DeskRoute-$V-android-arm64.apk"
          cp "$D/app-armeabi-v7a-release.apk" "dist/DeskRoute-$V-android-arm32.apk"
          cp "$D/app-x86_64-release.apk" "dist/DeskRoute-$V-android-x86_64.apk"
          cp "$D/app-universal-release.apk" "dist/DeskRoute-$V-android-universal.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          if-no-files-found: error
          path: dist/*.apk

  release:
    needs: [build, android]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DeskRoute ${{ steps.v.outputs.tag }}
          body_path: docs/release-notes/${{ steps.v.outputs.tag }}.md
          files: dist/*
          make_latest: true
